<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Back slide (offset layer) -->
  <rect x="20" y="12" width="58" height="40" rx="6" ry="6" fill="none" stroke="#3b82f6" stroke-width="4" opacity="0.4"/>
  <!-- Main slide frame -->
  <rect x="12" y="20" width="58" height="40" rx="6" ry="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="4"/>
  <!-- Slide headline bar -->
  <rect x="22" y="30" width="22" height="5" rx="2.5" fill="#3b82f6"/>
  <!-- Slide body lines -->
  <rect x="22" y="41" width="36" height="3.5" rx="1.75" fill="#93c5fd"/>
  <rect x="22" y="50" width="26" height="3.5" rx="1.75" fill="#bfdbfe"/>
  <!-- Image placeholder top-right of slide -->
  <rect x="52" y="26" width="12" height="10" rx="2" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.7"/>
  <!-- Flow arrow pointing right -->
  <line x1="74" y1="40" x2="87" y2="40" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <polyline points="82,33 89,40 82,47" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Navigation dots -->
  <circle cx="31" cy="74" r="3" fill="#bfdbfe"/>
  <circle cx="41" cy="74" r="4" fill="#3b82f6"/>
  <circle cx="51" cy="74" r="3" fill="#bfdbfe"/>
</svg>
